[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apk-from-scratch"
version = "0.1.0"
description = "Build and read signed, installable Android APKs in pure Python — no Android SDK, aapt, d8, JDK, zipalign, or apksigner."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "apk-from-scratch contributors" }]
keywords = ["android", "apk", "dex", "aapt", "apksigner", "reverse-engineering"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Security",
]
dependencies = ["cryptography>=41.0"]

[project.optional-dependencies]
test = ["androguard>=4.0", "pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/haizarakun/apk-from-scratch"
Documentation = "https://github.com/haizarakun/apk-from-scratch/blob/main/docs/format.md"
Issues = "https://github.com/haizarakun/apk-from-scratch/issues"

[project.scripts]
apkforge = "apkfs.apkforge:main"
apkinspect = "apkfs.apkinspect:main"

[tool.setuptools]
packages = ["apkfs"]
