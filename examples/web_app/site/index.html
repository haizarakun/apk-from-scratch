<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メモ帳</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 16px; background: #fafafa; }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  textarea { width: 100%; height: 40vh; font-size: 1rem; box-sizing: border-box; }
  button { font-size: 1rem; padding: 10px 14px; margin: 6px 6px 0 0; }
  ul { padding-left: 18px; } li { margin: 4px 0; }
  #news { white-space: pre-wrap; background: #fff; padding: 8px; border: 1px solid #ddd; }
</style>
</head>
<body>
<h1>📝 メモ帳（スクラッチ製）</h1>
<textarea id="memo" placeholder="ここに書くと自動で保存されます"></textarea>
<div>
  <button onclick="App.toast('保存済み ✅')">保存確認</button>
  <button onclick="App.share(memo.value)">共有</button>
  <button onclick="App.copy(memo.value)">コピー</button>
  <button onclick="App.open('https://github.com/haizarakun/apk-from-scratch')">サイトを開く</button>
</div>
<h2>一覧</h2>
<ul id="list"></ul>
<input id="item" placeholder="項目を追加"><button onclick="addItem()">追加</button>
<h2>端末の機能</h2>
<div>
  <button onclick="App.notify('メモ帳', memo.value || '（空）')">通知を出す</button>
  <button onclick="navigator.vibrate(200)">バイブ</button>
  <button onclick="where()">現在地</button>
  <button onclick="cam()">カメラ</button>
</div>
<p id="geo"></p>
<video id="v" autoplay playsinline muted style="width:100%;display:none;background:#000"></video>
<p>写真を選ぶ／撮る: <input type="file" accept="image/*" capture onchange="pic(this)"></p>
<img id="shot" style="max-width:100%;display:none">
<h2>通信</h2>
<button onclick="loadNews()">ネットから読み込む</button>
<p id="news">（ここに結果）</p>
<script src="apkfs-bridge.js"></script>
<script>
  // 保存: localStorage（アプリを閉じても残る）
  memo.value = localStorage.getItem("memo") || "";
  memo.addEventListener("input", () => localStorage.setItem("memo", memo.value));

  // 一覧: 追加・タップで削除
  const items = JSON.parse(localStorage.getItem("items") || "[]");
  function render() {
    list.innerHTML = "";
    items.forEach((t, i) => {
      const li = document.createElement("li");
      li.textContent = t + "  （タップで削除）";
      li.onclick = () => { items.splice(i, 1); save(); };
      list.appendChild(li);
    });
  }
  function save() { localStorage.setItem("items", JSON.stringify(items)); render(); }
  function addItem() { if (item.value.trim()) { items.push(item.value.trim()); item.value = ""; save(); } }
  render();

  // 端末の機能（ホストが許可を通すので、Web 標準 API がそのまま使える）
  function where() {
    geo.textContent = "取得中…";
    navigator.geolocation.getCurrentPosition(
      p => geo.textContent = `緯度 ${p.coords.latitude.toFixed(5)} / 経度 ${p.coords.longitude.toFixed(5)}`,
      e => geo.textContent = "エラー: " + e.message);
  }
  async function cam() {
    try {
      v.style.display = "block";
      v.srcObject = await navigator.mediaDevices.getUserMedia({ video: true });
    } catch (e) { App.toast("カメラ: " + e); }
  }
  function pic(input) {
    const f = input.files[0]; if (!f) return;
    shot.src = URL.createObjectURL(f); shot.style.display = "block";
  }

  // 通信: fetch（INTERNET 権限はホストが付与済み）
  async function loadNews() {
    news.textContent = "読み込み中…";
    try {
      const r = await fetch("https://api.github.com/zen");
      news.textContent = await r.text();
    } catch (e) {
      news.textContent = "エラー: " + e;
    }
  }
</script>
</body>
</html>
